<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fb">
  <title>Calculadora</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --card: #ffffff;
      --display: #f8f9fd;
      --text: #182033;
      --muted: #81899b;
      --key: #f0f2f8;
      --key-hover: #e6e9f2;
      --accent: #6558e8;
      --accent-hover: #5548d4;
      --operator: #eeecff;
      --border: #e8eaf1;
      --shadow: 0 24px 70px rgba(35, 43, 75, .12);
    }

    body.dark {
      color-scheme: dark;
      --bg: #11131b;
      --card: #1a1d28;
      --display: #151823;
      --text: #f3f4fa;
      --muted: #969caf;
      --key: #252938;
      --key-hover: #303548;
      --accent: #8175ff;
      --accent-hover: #7165ed;
      --operator: #302d4f;
      --border: #2b3040;
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(101, 88, 232, .10), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background .2s ease, color .2s ease;
    }

    .app {
      width: min(100%, 430px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 7px 18px rgba(101, 88, 232, .25);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 750;
      letter-spacing: -.3px;
    }

    .brand-caption {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .top-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
      color: var(--text);
      font-size: 17px;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    .icon-btn:hover { background: var(--key-hover); transform: translateY(-1px); }

    .calculator {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .display {
      min-height: 152px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      border-radius: 19px;
      background: var(--display);
      text-align: right;
    }

    .expression {
      min-height: 27px;
      overflow: hidden;
      color: var(--muted);
      font-size: 17px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .result {
      min-height: 58px;
      margin-top: 8px;
      overflow: hidden;
      font-size: clamp(36px, 10vw, 48px);
      font-weight: 700;
      letter-spacing: -2px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
      margin-top: 16px;
    }

    .key {
      min-height: 60px;
      border: 0;
      border-radius: 16px;
      background: var(--key);
      color: var(--text);
      font: inherit;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, background .12s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .key:hover { background: var(--key-hover); }
    .key:active { transform: scale(.96); }

    .key.utility {
      color: var(--accent);
      background: var(--operator);
      font-size: 16px;
    }

    .key.operator {
      color: var(--accent);
      font-size: 24px;
    }

    .key.equals {
      background: var(--accent);
      color: #fff;
      font-size: 25px;
      box-shadow: 0 8px 18px rgba(101, 88, 232, .2);
    }

    .key.equals:hover { background: var(--accent-hover); }

    .key.zero { grid-column: span 2; }

    .footer {
      margin: 15px 4px 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .history-panel {
      display: none;
      margin-top: 14px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .history-panel.open { display: block; }

    .history-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .clear-history {
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 210px;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--display);
      text-align: right;
    }

    .history-expression { color: var(--muted); font-size: 12px; }
    .history-value { margin-top: 3px; font-size: 16px; font-weight: 650; }
    .empty-history { padding: 15px 0; color: var(--muted); font-size: 13px; text-align: center; }

    @media (max-width: 380px) {
      body { padding: 16px 10px; }
      .calculator { padding: 13px; border-radius: 22px; }
      .keys { gap: 8px; }
      .key { min-height: 55px; border-radius: 14px; }
      .display { min-height: 135px; padding: 16px 14px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">÷</div>
        <div>
          <div class="brand-name">Calculadora</div>
          <div class="brand-caption">Simples, rápida e precisa</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="historyToggle" aria-label="Ver histórico" title="Histórico">◷</button>
        <button class="icon-btn" id="themeToggle" aria-label="Mudar tema" title="Mudar tema">☾</button>
      </div>
    </header>

    <section class="calculator" aria-label="Calculadora">
      <div class="display" aria-live="polite">
        <div class="expression" id="expression">Pronto para calcular</div>
        <div class="result" id="result">0</div>
      </div>

      <div class="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="delete" aria-label="Apagar último dígito">⌫</button>
        <button class="key utility" data-value="%">%</button>
        <button class="key operator" data-value="÷" aria-label="Dividir">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="×" aria-label="Multiplicar">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-" aria-label="Subtrair">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+" aria-label="Somar">+</button>

        <button class="key utility" data-value="(">(</button>
        <button class="key utility" data-value=")">)</button>
        <button class="key" data-action="sign">±</button>
        <button class="key" data-value=".">.</button>

        <button class="key zero" data-value="0">0</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
    </section>

    <section class="history-panel" id="historyPanel">
      <div class="history-heading">
        <span>Histórico</span>
        <button class="clear-history" id="clearHistory">Limpar histórico</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>

    <div class="footer">Também podes usar o teclado do teu dispositivo</div>
  </main>

  <script>
    const expressionEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");
    const historyPanel = document.getElementById("historyPanel");
    const historyList = document.getElementById("historyList");

    let expression = "";
    let justEvaluated = false;
    let history = JSON.parse(localStorage.getItem("calcHistory") || "[]");

    function displayExpression(value) {
      return value.replace(/\*/g, "×").replace(/\//g, "÷");
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "Erro";
      const rounded = Number.parseFloat(value.toPrecision(12));
      return new Intl.NumberFormat("pt-AO", {
        maximumFractionDigits: 10
      }).format(rounded);
    }

    // Calcula a expressão respeitando a prioridade das operações.
    function calculate(input) {
      const text = input.replace(/×/g, "*").replace(/÷/g, "/").replace(/\s/g, "");
      let position = 0;

      function parseExpression() {
        let value = parseTerm();
        while (text[position] === "+" || text[position] === "-") {
          const operator = text[position++];
          const next = parseTerm();
          value = operator === "+" ? value + next : value - next;
        }
        return value;
      }

      function parseTerm() {
        let value = parseFactor();
        while (text[position] === "*" || text[position] === "/") {
          const operator = text[position++];
          const next = parseFactor();
          if (operator === "/" && next === 0) throw new Error("Divisão por zero");
          value = operator === "*" ? value * next : value / next;
        }
        return value;
      }

      function parseFactor() {
        let value;

        if (text[position] === "+") {
          position++;
          value = parseFactor();
        } else if (text[position] === "-") {
          position++;
          value = -parseFactor();
        } else if (text[position] === "(") {
          position++;
          value = parseExpression();
          if (text[position] !== ")") throw new Error("Parênteses incompletos");
          position++;
        } else {
          const start = position;
          while (/[0-9.]/.test(text[position] || "")) position++;
          if (start === position) throw new Error("Expressão incompleta");
          const number = Number(text.slice(start, position));
          if (Number.isNaN(number)) throw new Error("Número inválido");
          value = number;
        }

        // Percentagem: 25% passa a 0,25.
        while (text[position] === "%") {
          value /= 100;
          position++;
        }
        return value;
      }

      const answer = parseExpression();
      if (position !== text.length || !Number.isFinite(answer)) {
        throw new Error("Expressão inválida");
      }
      return answer;
    }

    function updateDisplay() {
      expressionEl.textContent = expression
        ? displayExpression(expression)
        : "Pronto para calcular";

      if (!expression) {
        resultEl.textContent = "0";
        return;
      }

      try {
        resultEl.textContent = formatNumber(calculate(expression));
      } catch {
        resultEl.textContent = "…";
      }
    }

    function addValue(value) {
      if (justEvaluated && /[0-9.(]/.test(value)) expression = "";
      justEvaluated = false;

      const operators = ["+", "-", "*", "/"];
      const normalized = value === "×" ? "*" : value === "÷" ? "/" : value;

      if (operators.includes(normalized)) {
        if (!expression && normalized !== "-") return;
        if (operators.includes(expression.slice(-1))) {
          expression = expression.slice(0, -1);
        }
      }

      if (normalized === ".") {
        const currentNumber = expression.split(/[+\-*/()%()]/).pop();
        if (currentNumber.includes(".")) return;
        if (!currentNumber) expression += "0";
      }

      expression += normalized;
      updateDisplay();
    }

    function clearAll() {
      expression = "";
      justEvaluated = false;
      updateDisplay();
    }

    function deleteLast() {
      if (justEvaluated) {
        clearAll();
        return;
      }
      expression = expression.slice(0, -1);
      updateDisplay();
    }

    function toggleSign() {
      if (!expression) {
        expression = "-";
      } else {
        const match = expression.match(/(\d*\.?\d+)%?$/);
        if (!match) {
          expression += "-";
        } else {
          const start = match.index;
          const number = match[0];
          const before = expression.slice(0, start);
          expression = before.endsWith("-")
            ? before.slice(0, -1) + number
            : before + "-" + number;
        }
      }
      justEvaluated = false;
      updateDisplay();
    }

    function saveHistory(original, answer) {
      history.unshift({ expression: original, result: answer });
      history = history.slice(0, 10);
      localStorage.setItem("calcHistory", JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      if (!history.length) {
        historyList.innerHTML = '<div class="empty-history">Ainda não há cálculos.</div>';
        return;
      }

      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-expression">${displayExpression(item.expression)} =</div>
          <div class="history-value">${formatNumber(item.result)}</div>
        </div>
      `).join("");
    }

    function showResult() {
      if (!expression) return;
      try {
        const original = expression;
        const answer = calculate(expression);
        saveHistory(original, answer);
        expression = String(Number.parseFloat(answer.toPrecision(12)));
        expressionEl.textContent = displayExpression(original) + " =";
        resultEl.textContent = formatNumber(answer);
        justEvaluated = true;
      } catch {
        resultEl.textContent = "Erro";
        expressionEl.textContent = "Verifica a expressão";
      }
    }

    document.querySelector(".keys").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, value } = button.dataset;
      if (action === "clear") clearAll();
      else if (action === "delete") deleteLast();
      else if (action === "sign") toggleSign();
      else if (action === "equals") showResult();
      else if (value) addValue(value);
    });

    document.getElementById("historyToggle").addEventListener("click", () => {
      historyPanel.classList.toggle("open");
    });

    document.getElementById("clearHistory").addEventListener("click", () => {
      history = [];
      localStorage.removeItem("calcHistory");
      renderHistory();
    });

    document.getElementById("themeToggle").addEventListener("click", event => {
      document.body.classList.toggle("dark");
      event.currentTarget.textContent =
        document.body.classList.contains("dark") ? "☀" : "☾";
    });

    document.addEventListener("keydown", event => {
      if (/^[0-9.]$/.test(event.key)) addValue(event.key);
      else if (event.key === "+") addValue("+");
      else if (event.key === "-") addValue("-");
      else if (event.key === "*") addValue("×");
      else if (event.key === "/") {
        event.preventDefault();
        addValue("÷");
      } else if (event.key === "%") addValue("%");
      else if (event.key === "(" || event.key === ")") addValue(event.key);
      else if (event.key === "Enter" || event.key === "=") showResult();
      else if (event.key === "Backspace") deleteLast();
      else if (event.key === "Escape") clearAll();
    });

    renderHistory();
    updateDisplay();
  </script>
</body>
</html>
