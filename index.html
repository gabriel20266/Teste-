<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Tarefas do Dia 2</title>
<style>
:root{--ink:#14213D;--mint:#7B2CBF;--bg:#F3F7F8;--card:#fff;--amber:#FFB703;--mut:#6b7a8c}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 24px) 20px 28px}
h1{font-size:1.6rem}
#resumo{margin-top:6px;color:#b8c4d6;font-size:.95rem}
main{padding:16px;max-width:560px;margin:auto}
form{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;padding:14px;border:2px solid #d5dee6;border-radius:12px;font-size:1rem}
input:focus{outline:3px solid var(--mint);border-color:var(--mint)}
button{border:0;border-radius:12px;font-size:1rem;cursor:pointer}
.add{background:var(--mint);color:var(--ink);font-weight:700;padding:0 18px}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);padding:14px;border-radius:12px;margin-bottom:8px}
li.ok span{text-decoration:line-through;color:var(--mut)}
li span{flex:1;word-break:break-word}
li input{flex:none;width:22px;height:22px;accent-color:var(--mint)}
.del{background:none;color:var(--mut);padding:6px 10px}
.vazio{text-align:center;color:var(--mut);padding:32px 0}
#estado{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);font-size:.8rem;color:#fff;background:#ffffff22;padding:4px 10px;border-radius:99px}
#aviso{display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--amber);color:var(--ink);padding:14px;border-radius:14px;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
#aviso button{background:var(--ink);color:#fff;padding:10px 14px}
</style>
</head>
<body>
<header>
  <h1>Tarefas do Dia 2</h1>
  <p id="resumo"></p>
  <div id="estado"></div>
</header>
<main>
  <form id="f"><input id="t" placeholder="Nova tarefa" autocomplete="off" required><button class="add">Adicionar</button></form>
  <ul id="lista"></ul>
</main>
<div id="aviso"><span>Nova versão disponível</span><button id="atualizar">Atualizar agora</button></div>
<script>
const VERSAO='1.2';
let tarefas=[],clicou=false;
try{tarefas=JSON.parse(localStorage.getItem('tarefas')||'[]')}catch(e){}
const $=id=>document.getElementById(id);
function salvar(){try{localStorage.setItem('tarefas',JSON.stringify(tarefas))}catch(e){}}
function mostrar(){
  const l=$('lista');l.innerHTML='';
  if(!tarefas.length)l.innerHTML='<p class="vazio">Nenhuma tarefa. Adicione a primeira acima.</p>';
  tarefas.forEach((x,i)=>{
    const li=document.createElement('li');if(x.ok)li.className='ok';
    const c=document.createElement('input');c.type='checkbox';c.checked=x.ok;c.onchange=()=>{x.ok=c.checked;salvar();mostrar()};
    const s=document.createElement('span');s.textContent=x.txt;
    const d=document.createElement('button');d.className='del';d.textContent='Apagar';d.onclick=()=>{tarefas.splice(i,1);salvar();mostrar()};
    li.append(c,s,d);l.append(li);
  });
  const f=tarefas.filter(x=>x.ok).length;
  $('resumo').textContent=f+' de '+tarefas.length+' concluídas · v'+VERSAO;
}
$('f').onsubmit=e=>{e.preventDefault();const v=$('t').value.trim();if(!v)return;tarefas.unshift({txt:v,ok:false});$('t').value='';salvar();mostrar()};
function rede(){$('estado').textContent=navigator.onLine?'Online':'Offline'}
addEventListener('online',rede);addEventListener('offline',rede);rede();mostrar();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const pronto=w=>{$('aviso').style.display='flex';$('atualizar').onclick=()=>{clicou=true;w.postMessage('ativar')}};
    if(reg.waiting&&navigator.serviceWorker.controller)pronto(reg.waiting);
    reg.addEventListener('updatefound',()=>{
      const n=reg.installing;
      n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)pronto(n)});
    });
    setInterval(()=>reg.update().catch(()=>{}),60000);
  }).catch(()=>{});
  let rec=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rec||!clicou)return;rec=true;location.reload()});
}
</script>
</body>
</html>
